name: Deploy

# Deploys the production build to Firebase Hosting whenever main is updated.
#
# This is a monorepo (ui-projects); this workflow only builds/deploys the
# invoice-project subdirectory (firebase.json lives there too, hence
# `entryPoint` on the deploy step below).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: PROD
    defaults:
      run:
        working-directory: invoice-project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: invoice-project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Firebase web config is public by design (it identifies the project,
          # it does not authorize access — Firestore/Auth security rules do
          # that) but it still needs to reach the build as CRA env vars.
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: invoice-project

      # action-hosting-deploy above only touches Hosting. firestore.rules is
      # tracked in this repo (see firebase.json) but nothing else deploys it,
      # so without this step it can silently drift from what's actually live
      # — see the 2026-09-02 "can't save client/invoice" incident, caused by
      # exactly that drift.
      - name: Deploy Firestore rules
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          npx firebase-tools deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
