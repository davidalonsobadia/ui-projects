name: CI

# Required status check for the protected `main` branch.
# Runs on every PR and on direct pushes to main.
#
# This is a monorepo (ui-projects); this workflow only builds/tests the
# invoice-project subdirectory.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: invoice-project
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: invoice-project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false

      - name: Build
        run: npm run build
